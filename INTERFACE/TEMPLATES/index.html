<!DOCTYPE html>
<html>
<head>
    <title>CRUD MongoDB</title>
</head>
<body>
    <h2>Selecione a Collection e a Operação</h2>
    <form method="POST">
        <label>Collection:</label>
        <select name="collection">
            <option value="desastres_naturais">Desastres Naturais</option>
            <option value="relatorios_desastres">Relatórios de Desastres</option>
        </select><br><br>

        <label>Ação:</label>
        <select name="action">
            <option value="criar">Criar</option>
            <option value="listar">Listar</option>
        </select><br><br>

        <button type="submit">Ir</button>
    </form>
</body>
</html>
