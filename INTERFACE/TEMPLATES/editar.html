<!DOCTYPE html>
<html>
<head><title>Editar Registro</title></head>
<body>
    <h2>Editar registro de {{ collection }}</h2>
    <form method="POST">
        {% for key, value in documento.items() %}
            {% if key != "_id" %}
                {{ key }}: <input type="text" name="{{ key }}" value="{{ value }}"><br>
            {% endif %}
        {% endfor %}
        <button type="submit">Salvar</button>
    </form>
</body>
</html>
